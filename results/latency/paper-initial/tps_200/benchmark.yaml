name: Latency-Sweep

monitors:
  transaction:
    - module: logging
      options:
        loggerModuleName: txinfo
        messageLevel: info

test:
  workers:
    number: 10
  rounds:
    - label: createAsset_tps_200
      description: Latency sweep point at 200 TPS
      txDuration: 8
      trim: 2
      rateControl:
        type: fixed-rate
        opts:
          tps: 200
      workload:
        module: workloads/createAsset.js
        arguments:
          payloadKB: 1
