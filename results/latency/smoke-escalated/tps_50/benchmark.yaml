name: Latency-Sweep

monitors:
  transaction:
    - module: logging
      options:
        loggerModuleName: txinfo
        messageLevel: info

test:
  workers:
    number: 10
  rounds:
    - label: createAsset_tps_50
      description: Latency sweep point at 50 TPS
      txDuration: 5
      trim: 1
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workloads/createAsset.js
        arguments:
          payloadKB: 1
